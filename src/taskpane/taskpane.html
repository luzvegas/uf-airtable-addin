<!-- First-run page layout -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UF Airtable</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- MSAL Browser (CDN) -->
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

    <!-- Fluent UI core -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="pane">
    <header class="app-header">
        <img width="48" height="48" src="../assets/uf-outline-logo.png" alt="UF Airtable" />
        <div>
            <h1>UF Airtable AddIn</h1>
            <p class="version-line">UI-Version: <span id="ui-version">-</span></p>
        </div>
    </header>

    <section id="sideload-msg" class="card notice">
        <p>Bitte <a target="_blank" href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-f%C3%BCr-testing">sideload</a> das Add-in, um den Inhalt zu sehen.</p>
    </section>

    <main id="app-body" class="app-body" style="display: none;">
        <section class="card">
            <h2>Aktuelle Mail</h2>
            <dl class="mail-meta">
                <dt>Betreff</dt>
                <dd id="mail-subject">-</dd>
                <dt>Absender</dt>
                <dd id="mail-from">-</dd>
                <dt>Eingang</dt>
                <dd id="mail-date">-</dd>
            </dl>
            <div class="toggle-row">
                <button id="person-toggle" type="button" class="primary small">Person erfassen</button>
                <button id="company-toggle" type="button" class="primary small">Firma erfassen</button>
            </div>
            <div class="person-form collapsed" id="person-form" autocomplete="off">
                <label>Name
                    <input id="person-name" type="text" placeholder="Name der Person" autocomplete="off" />
                    <p id="person-duplicate-hint" class="status info"></p>
                </label>
                <label>E-Mail
                    <input id="person-email" type="email" placeholder="name@firma.ch" autocomplete="off" />
                    <p id="person-email-duplicate-hint" class="status info"></p>
                </label>
                <label>Firma
                    <input list="person-company-datalist" id="person-company-input" type="text" placeholder="Firma suchen oder recID eingeben" autocomplete="off" />
                    <datalist id="person-company-datalist"></datalist>
                    <span class="input-hint">Tippe zum Suchen (Firmenname) oder füge eine Record-ID ein.</span>
                </label>
                <p id="company-select-status" class="status info"></p>
                <label>Rolle
                    <input list="person-role-datalist" id="person-role-input" type="text" placeholder="Rolle(n) suchen oder eingeben" required autocomplete="off" />
                    <datalist id="person-role-datalist"></datalist>
                </label>
                <label>Telefon (Mobil)
                    <input id="person-phone-mobile" type="text" placeholder="+41 79 123 45 67" autocomplete="off" />
                </label>
                <label>Telefon
                    <input id="person-phone" type="text" placeholder="+41 44 123 45 67" autocomplete="off" />
                </label>
                <div class="mail-actions">
                    <button id="create-person-btn" type="button" class="primary">Person aus Absender anlegen</button>
                    <p id="person-status" class="status"></p>
                </div>
            </div>
            <div class="company-form collapsed" id="company-form" autocomplete="off">
                <label>Firmenname
                    <input id="company-name" type="text" placeholder="Firmenname" required autocomplete="off" />
                    <p id="company-duplicate-hint" class="status info"></p>
                </label>
                <label>E-Mail
                    <input id="company-email" type="email" placeholder="info@firma.ch" autocomplete="off" />
                </label>
                <label>Telefon
                    <input id="company-phone" type="text" placeholder="+41 44 123 45 67" autocomplete="off" />
                </label>
                <label>Webseite
                    <input id="company-website" type="url" placeholder="https://firma.ch" autocomplete="off" />
                </label>
                <label>Strasse
                    <input id="company-street" type="text" placeholder="Strasse" autocomplete="off" />
                </label>
                <label>Hausnummer
                    <input id="company-house-number" type="text" placeholder="Nr." autocomplete="off" />
                </label>
                <label>PLZ
                    <input id="company-zip" type="number" placeholder="8000" autocomplete="off" />
                </label>
                <label>Ort
                    <input id="company-city" type="text" placeholder="Ort" autocomplete="off" />
                </label>
                <label>Land
                    <select id="company-country" autocomplete="off">
                        <option value="">Nicht gesetzt</option>
                        <option value="Schweiz">Schweiz</option>
                        <option value="Deutschland">Deutschland</option>
                        <option value="USA">USA</option>
                        <option value="Grossbritannien">Grossbritannien</option>
                        <option value="Norwegen">Norwegen</option>
                    </select>
                </label>
                <label>Sprache
                    <select id="company-language" autocomplete="off">
                        <option value="">Nicht gesetzt</option>
                        <option value="Deutsch">Deutsch</option>
                        <option value="Englisch">Englisch</option>
                    </select>
                </label>
                <label>Kategorie (mehrere möglich)
                    <input list="company-category-datalist" id="company-category" type="text" placeholder="Kategorie suchen oder eingeben" autocomplete="off" />
                    <datalist id="company-category-datalist">
                        <option value="Kunde"></option>
                        <option value="Supplier"></option>
                        <option value="DIT"></option>
                        <option value="VFX"></option>
                        <option value="IT"></option>
                        <option value="Unterhalt/Bau"></option>
                        <option value="Reinigung"></option>
                        <option value="Quality Control"></option>
                    </datalist>
                    <div id="company-category-selected" class="token-list"></div>
                    <span class="input-hint">Mehrere Kategorien mit Enter/Komma/Semikolon bestätigen.</span>
                </label>
                <div class="mail-actions">
                    <button id="create-company-btn" type="button" class="primary">Firma anlegen</button>
                    <p id="company-status" class="status"></p>
                </div>
            </div>
        </section>

        <div class="section-selector card">
            <label class="section-title">Bereich wählen
                <select id="section-select">
                    <option value="tab-tasks" selected>Tasks/Termine</option>
                    <option value="tab-docs">Dokumente/Links</option>
                    <option value="tab-notes">Gesprächsnotizen</option>
                    <option value="tab-finance">Offerten</option>
                </select>
            </label>
        </div>

        <div class="tab-panel active" id="tab-tasks">
            <section class="card">
                <h2>Mail als To-Do speichern</h2>
                <form id="task-form" class="form-grid">
                    <label>Titel
                        <input id="task-title" type="text" placeholder="Standard: Betreff" />
                    </label>
                    <label>Art
                        <select id="task-art">
                            <option value="Task" selected>Task</option>
                            <option value="Termin">Termin</option>
                        </select>
                    </label>
                    <label>Beschreibung
                        <textarea id="task-description" rows="3" placeholder="Beschreibung der Aufgabe"></textarea>
                    </label>
                    <label>Projekt
                        <input list="task-project-datalist" id="task-project-input" class="project-input" type="text" placeholder="Projektnamen suchen oder recID einfügen" />
                        <datalist id="task-project-datalist"></datalist>
                        <span class="input-hint">Tippe zum Suchen (Name) oder füge eine Record-ID ein.</span>
                    </label>
                    <p id="project-select-status" class="status info"></p>
                    <label>Zuständig intern
                        <input list="task-owner-datalist" id="task-owner-input" class="project-input" type="text" placeholder="Name suchen oder E-Mail eingeben" />
                        <datalist id="task-owner-datalist"></datalist>
                        <span class="input-hint">Tippe zum Suchen (Name/E-Mail) oder füge eine E-Mail/ID ein.</span>
                    </label>
                    <label>Zuständig extern
                        <input list="task-external-datalist" id="task-external" type="text" placeholder="Name suchen oder recID eingeben" />
                        <datalist id="task-external-datalist"></datalist>
                        <span class="input-hint">Tippe zum Suchen (Personen) oder füge eine Record-ID ein.</span>
                    </label>
                    <label>Start (Datum/Uhrzeit)
                        <input id="task-start" type="datetime-local" />
                    </label>
                    <label>Ende (Datum/Uhrzeit)
                        <input id="task-end" type="datetime-local" />
                    </label>
                    <label>Status
                        <select id="task-status-select">
                            <option value="">Nicht gesetzt</option>
                            <option value="Offen">Offen</option>
                            <option value="In Arbeit">In Arbeit</option>
                            <option value="Warten">Warten</option>
                            <option value="Abgeschlossen">Abgeschlossen</option>
                        </select>
                    </label>
                    <label>Priorität
                        <select id="task-priority">
                            <option value="">Nicht gesetzt</option>
                            <option value="niedrig">niedrig</option>
                            <option value="Normal">Normal</option>
                            <option value="Hoch">Hoch</option>
                            <option value="Kritisch">Kritisch</option>
                        </select>
                    </label>
                    <label>Kategorie
                        <select id="task-category">
                            <option value="">Nicht gesetzt</option>
                            <option value="Conform">Conform</option>
                            <option value="Grading">Grading</option>
                            <option value="Deliveries">Deliveries</option>
                            <option value="Mastering">Mastering</option>
                            <option value="Intern">Intern</option>
                            <option value="Extern">Extern</option>
                            <option value="Technisch">Technisch</option>
                            <option value="VFX">VFX</option>
                            <option value="Edit">Edit</option>
                            <option value="Sound">Sound</option>
                            <option value="Untertitel">Untertitel</option>
                            <option value="Meet/Talk">Meet/Talk</option>
                            <option value="Screening">Screening</option>
                            <option value="Administration">Administration</option>
                            <option value="Buchhhaltung">Buchhhaltung</option>
                            <option value="Deadline">Deadline</option>
                        </select>
                    </label>
                    <div class="form-block">
                        <span>Anhänge für diese Aufgabe</span>
                        <div id="task-attachment-choices" class="choice-list"></div>
                    </div>
                    <button type="submit" class="primary">Aufgabe anlegen</button>
                    <p id="task-status" class="status"></p>
                </form>
            </section>
        </div>

        <div class="tab-panel" id="tab-docs">
            <section class="card">
                <h2>Links oder Dokumente</h2>
                <form id="document-form" class="form-grid">
                    <label>Projekt
                        <input list="document-project-datalist" id="document-project-input" type="text" required />
                        <datalist id="document-project-datalist"></datalist>
                    </label>
                    <label>Bezeichnung
                        <input id="document-label" type="text" placeholder="z.B. Angebot.pdf" required />
                    </label>
                    <label>Quelle
                        <select id="document-source">
                            <option value="link">Link aus der Mail</option>
                            <option value="attachment">Anhang</option>
                        </select>
                    </label>
                    <div id="document-link-group" class="form-block">
                        <label>Gefundene Links</label>
                        <div id="document-link-choices" class="choice-list"></div>
                    </div>
                    <div id="document-attachment-group" class="form-block hidden">
                        <label>Verfügbare Anhänge</label>
                        <div id="document-attachment-choices" class="choice-list"></div>
                    </div>
                    <button type="submit" class="primary">Eintrag anlegen</button>
                    <p id="document-status" class="status"></p>
                </form>
            </section>
        </div>

        <div class="tab-panel" id="tab-notes">
            <section class="card">
                <h2>Gesprächsnotiz speichern</h2>
                <form id="note-form" class="form-grid">
                    <label>Titel
                        <input id="note-title" type="text" placeholder="Standard: Betreff" />
                    </label>
                    <label>Notiz
                        <textarea id="note-body" rows="4" placeholder="Mail-Text oder eigene Notiz"></textarea>
                    </label>
                    <label>Projekt
                        <input list="note-project-datalist" id="note-project-input" class="project-input" type="text" placeholder="Projektnamen suchen oder recID eingeben" />
                        <datalist id="note-project-datalist"></datalist>
                    </label>
                    <label>Art
                        <select id="note-art">
                            <option value="Telefon">Telefon</option>
                            <option value="Intern">Intern</option>
                            <option value="Meeting">Meeting</option>
                            <option value="E-Mail" selected>E-Mail</option>
                            <option value="Sonstiges">Sonstiges</option>
                        </select>
                    </label>
                    <label>Person(en)
                        <input list="note-person-datalist" id="note-persons" type="text" placeholder="Name oder recID, kommasepariert" />
                        <datalist id="note-person-datalist"></datalist>
                        <div id="note-persons-selected" class="token-list"></div>
                        <span class="input-hint">Tippe zum Suchen, bestätige mit Enter/Komma/Semikolon; mehrfach möglich.</span>
                    </label>
                    <button type="submit" class="primary">Notiz speichern</button>
                    <p id="note-status" class="status"></p>
                </form>
            </section>
        </div>

        <div class="tab-panel" id="tab-finance">
            <section class="card">
                <h2>Mail als Offerte speichern</h2>
                <form id="finance-form" class="form-grid">
                    <label>Dokumententitel
                        <input id="finance-title" type="text" placeholder="Standard: Betreff" />
                    </label>
                    <label>Projekt
                        <input list="finance-project-datalist" id="finance-project-input" type="text" required />
                        <datalist id="finance-project-datalist"></datalist>
                    </label>
                    <label>Status Offerte
                        <select id="finance-offer-status">
                            <option value="">Nicht gesetzt</option>
                            <option value="Versendet">Versendet</option>
                            <option value="Angenommen">Angenommen</option>
                            <option value="Abgelehnt">Abgelehnt</option>
                        </select>
                    </label>
                    <label>Vereinbarungskanal
                        <select id="finance-channel">
                            <option value="Mail" selected>Mail</option>
                            <option value="PDF-Offerte">PDF-Offerte</option>
                            <option value="Mündlich">Mündlich</option>
                            <option value="Telefon">Telefon</option>
                        </select>
                    </label>
                    <label>Betrag (CHF)
                        <input id="finance-amount" type="number" step="0.01" min="0" required />
                    </label>
                    <label>Datum
                        <input id="finance-date" type="datetime-local" required />
                    </label>
                    <button type="submit" class="primary">Offerte anlegen</button>
                    <p id="finance-status" class="status"></p>
                </form>
            </section>
        </div>
    </main>
</body>

</html>
