name: Build and deploy Node.js project to Azure Function App - airtable-proxy-uf

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  FUNCTION_PATH: 'airtable-proxy'
  PACKAGE_PATH: '${{ github.workspace }}/release.zip'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.FUNCTION_PATH }}

      - name: Build
        run: npm run build --if-present
        working-directory: ${{ env.FUNCTION_PATH }}

      - name: Test
        run: npm run test --if-present
        working-directory: ${{ env.FUNCTION_PATH }}

      - name: Package function app
        run: |
          cd ${{ env.FUNCTION_PATH }}
          zip -r "${{ env.PACKAGE_PATH }}" .

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        with:
          app-name: airtable-proxy
          slot-name: Production
          package: ${{ env.PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
